spring.application.name=zhan-finance-backend
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zhanfindb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# spring.h2.console.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Pool Tuning (Fly.io specific)
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=150000

# Cache Configuration
spring.cache.type=caffeine
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=110

spring.sql.init.encoding=UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://mrsgemaseny.github.io}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator & Prometheus Observability Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:8080}

# OTLP Metrics Export (Grafana Cloud)
management.otlp.metrics.export.url=${OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${OTLP_METRICS_AUTH:}
management.otlp.metrics.export.step=60s

# Sentry Error Tracking (configured in application-prod.properties)
sentry.dsn=${SENTRY_DSN:}

# Storage Configuration
app.storage.type=db
app.storage.local.path=${STORAGE_LOCAL_PATH:./uploads}

# Multipart/File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Email Configuration (SMTP)
# Replace with actual credentials for production
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from-address=${MAIL_FROM:no-reply@zhan-finance.com}

# Frontend Integration
app.frontend.url=${FRONTEND_URL:https://mrsgemaseny.github.io/JF-1C}

# Telegram Business Notifications
telegram.business.bot.token=${TELEGRAM_BUSINESS_BOT_TOKEN:}
telegram.business.admin.chat-id=${TELEGRAM_BUSINESS_CHAT_ID:}
