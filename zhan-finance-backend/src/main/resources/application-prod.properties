# Disable Swagger/OpenAPI in production for security
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Strict production CORS with mobile apps support (Capacitor/Cordova)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://mrsgemaseny.github.io,https://zhanfinance.fly.dev,capacitor://localhost,http://localhost,https://localhost,ionic://localhost}}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:${CORS_ALLOWED_ORIGIN_PATTERNS:https://zhanfinance.fly.dev,https://mrsgemaseny.github.io,capacitor://*,ionic://*,http://localhost:*,https://localhost:*}}

# Sentry Production Config
sentry.dsn=${SENTRY_DSN}
sentry.send-default-pii=false
sentry.environment=production