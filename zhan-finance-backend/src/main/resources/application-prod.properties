# Disable Swagger/OpenAPI in production for security
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Strict production CORS (drops localhost unless overridden by env)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://mrsgemaseny.github.io,https://zhanfinance.fly.dev}}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.github.io,https://zhanfinance.fly.dev}}