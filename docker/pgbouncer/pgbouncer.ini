[databases]
zhanfindb = host=postgres port=5432 dbname=zhanfindb

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 30
min_pool_size = 5
reserve_pool = 10
reserve_pool_timeout = 5
max_db_connections = 100
