name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'zhan-finance-backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Fly.io
    environment:
      name: production
      url: https://zhanfinance.fly.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: zhan-finance-backend/build.gradle

      - name: Grant execute permission for gradlew
        working-directory: ./zhan-finance-backend
        run: chmod +x gradlew

      - name: Build and Test
        working-directory: ./zhan-finance-backend
        run: ./gradlew test bootJar --no-daemon

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: ./zhan-finance-backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Telegram (deploy success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="[DEPLOY OK] ZhanFinance backend deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Notify Telegram (deploy failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="[DEPLOY FAIL] ZhanFinance backend deployment FAILED at $(date -u +%Y-%m-%dT%H:%M:%SZ)"