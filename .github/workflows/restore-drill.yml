name: Database Restore Drill

on:
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday at 04:00 UTC
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: pass1
          POSTGRES_DB: zhanfindb_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./zhan-finance-backend/gradlew

      - name: Apply Flyway Migrations on Ephemeral PostgreSQL 17
        run: |
          ./gradlew test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/zhanfindb_drill -Dspring.datasource.username=test_user -Dspring.datasource.password=pass1 --no-daemon
        working-directory: ./zhan-finance-backend

      - name: Verify Schema and Core Tables
        env:
          PGPASSWORD: pass1
        run: |
          psql -h localhost -U test_user -d zhanfindb_drill -c "\dt"
          psql -h localhost -U test_user -d zhanfindb_drill -c "SELECT count(*) FROM app_users;"
