name: PostgreSQL Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Каждый день в 02:00 UTC (08:00 по времени Алматы)
  workflow_dispatch:       # Ручной запуск из интерфейса GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_DB_API_TOKEN }}

    steps:
      - name: Настройка утилиты flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_API_TOKEN }}

      - name: Создание бэкапа базы данных через прямой SSH-поток Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_API_TOKEN }}
        run: |
          set -euo pipefail

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="jf1c_backup_${TIMESTAMP}.sql.gz"

          # Получаем параметры подключения из секретов GitHub
          DB_USER="${{ secrets.DB_USER }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_PASS="${{ secrets.DB_PASSWORD }}"

          # Прямое выполнение pg_dump внутри контейнера базы данных без посредников и локальных прокси-сокетов
          flyctl ssh console -a zhanfinance-db -C "sh -c 'PGPASSWORD=$DB_PASS pg_dump -h localhost -U $DB_USER $DB_NAME --clean --if-exists'" | gzip > "$FILENAME"

          # Проверка размера сформированного архива (мимум 1КБ для валидного бэкапа)
          SIZE=$(stat -c%s "$FILENAME")
          if [ "$SIZE" -lt 1000 ]; then
            echo "ОШИБКА: Файл бэкапа слишком мал ($SIZE байт) - возможный сбой выгрузки"
            exit 1
          fi

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Загрузка архива бэкапа в GitHub Artifacts (хранение 90 дней)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TIMESTAMP }}
          path: ${{ env.FILENAME }}
          retention-days: 90

      - name: Отправка уведомления в Telegram при успехе
        if: success()
        run: |
          SIZE_MB=$(echo "scale=2; ${{ env.SIZE }} / 1048576" | bc)
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="[SUCCESS] <b>JF-1C Backup Completed</b>%0ADate: ${{ env.TIMESTAMP }}%0ASize: ${SIZE_MB} MB%0ARetention: 90 days in GitHub Artifacts"

      - name: Отправка аперта в Telegram при ошибке
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="[ALERT] <b>JF-1C Backup FAILED</b>%0ADate: $(date +%Y%m%d_%H%M%S)%0ACheck GitHub Actions log for details."
